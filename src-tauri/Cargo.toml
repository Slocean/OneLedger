[package]
name = "oneledger"
version = "0.4.14"
description = "OneLedger desktop"
authors = ["OneLedger"]
edition = "2021"

[lib]
name = "oneledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 开发验收通道（/api/dev/ui/* + DevUiChannel）：只随显式 --features devui 编译，
# 正式构建完全不包含该通道（B-08）。
devui = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust-embed = "8"
mime_guess = "2"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "native-tls"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
