name: Release

# 触发方式：
#   release.bat            → 打 vX.Y.Z tag 并推送
#   npm run release
#   Actions → Run workflow
#
# 成品：OneLedger-Setup.exe（安装版）+ OneLedger-Portable.exe（便携版）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖版本号（留空则用 package.json）"
        required: false
        type: string
        default: ""
      prerelease:
        description: "标记为 pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/CI.yml

  build-and-release:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          PRERELEASE=false
          PKG=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            if [ -z "$RAW" ]; then
              RAW="$PKG"
            fi
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE=true
            fi
            TAG="v${RAW}"
          else
            REF="${GITHUB_REF_NAME}"
            if [[ "$REF" == v* ]]; then
              RAW="${REF#v}"
              TAG="$REF"
            else
              echo "unsupported tag: $REF" >&2
              exit 1
            fi
          fi
          if [ -z "$RAW" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          if [ "$RAW" != "$PKG" ]; then
            echo "tag/input version $RAW does not match package.json $PKG" >&2
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=OneLedger ${RAW}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$RAW tag=$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Use crates.io on CI
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "src-tauri\.cargo\config.toml") {
            Remove-Item -LiteralPath "src-tauri\.cargo\config.toml" -Force
          }

      - name: Install dependencies
        run: npm ci

      - name: Ensure app icon
        shell: pwsh
        run: |
          powershell -File scripts/make-icon.ps1
          New-Item -ItemType Directory -Force -Path src-tauri\icons | Out-Null
          Copy-Item -LiteralPath desktop\icons\icon.ico -Destination src-tauri\icons\icon.ico -Force

      - name: Pack Tauri installer
        run: npm run pack

      - name: Hash exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("OneLedger-Setup.exe", "OneLedger-Portable.exe")) {
            $exe = Join-Path "release" $name
            if (-not (Test-Path -LiteralPath $exe)) {
              throw "$name missing after Tauri pack"
            }
            $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$name" | Set-Content -LiteralPath "$exe.sha256" -Encoding ascii
          }
          Get-ChildItem release -File | Select-Object Name, Length

      - name: Release notes from app_update.json
        shell: bash
        run: |
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('app_update.json','utf8')); const h=(j.history&&j.history[0])||{}; fs.writeFileSync('release-notes.md', [h.title||'', '', h.body||''].join('\n'));"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            release/OneLedger-Setup.exe
            release/OneLedger-Setup.exe.sha256
            release/OneLedger-Portable.exe
            release/OneLedger-Portable.exe.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
