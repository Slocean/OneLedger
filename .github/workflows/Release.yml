name: Release

# 触发方式：
#   release.bat            → 打 vX.Y.Z tag 并推送
#   npm run release
#   Actions → Run workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: "覆盖版本号（留空则用 package.json）"
        required: false
        type: string
        default: ""
      prerelease:
        description: "标记为 pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/CI.yml

  build-and-release:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          PRERELEASE=false
          PKG=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            if [ -z "$RAW" ]; then
              RAW="$PKG"
            fi
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE=true
            fi
            TAG="v${RAW}"
          else
            REF="${GITHUB_REF_NAME}"
            if [[ "$REF" == v* ]]; then
              RAW="${REF#v}"
              TAG="$REF"
            else
              echo "unsupported tag: $REF" >&2
              exit 1
            fi
          fi
          if [ -z "$RAW" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          if [ "$RAW" != "$PKG" ]; then
            echo "tag/input version $RAW does not match package.json $PKG" >&2
            exit 1
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "release_name=OneLedger ${RAW}" >> "$GITHUB_OUTPUT"
          echo "zip_name=OneLedger-${RAW}-win.zip" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$RAW tag=$TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "node_modules\electron\dist\electron.exe")) {
            node node_modules/electron/install.js
          }

      - name: Pack desktop app
        run: npm run pack

      - name: Zip portable app and hash
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "release\desktop\OneLedger"
          if (-not (Test-Path -LiteralPath "$src\OneLedger.exe")) {
            throw "OneLedger.exe missing after pack"
          }
          $zipName = "${{ steps.ver.outputs.zip_name }}"
          $zipPath = Join-Path "release" $zipName
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$zipName" | Set-Content -LiteralPath "$zipPath.sha256" -Encoding ascii
          Get-ChildItem release | Select-Object Name, Length
          Get-Content -LiteralPath "$zipPath.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release/${{ steps.ver.outputs.zip_name }}
            release/${{ steps.ver.outputs.zip_name }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
